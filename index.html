<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOXIS | Solutions IT & Cloud</title>
    <style>
        /* --- RESET & VARIABLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        :root {
            --primary-color: #E60000; /* Rouge NOXIS */
            --dark-bg: #0a192f;       /* Bleu nuit corporate */
            --text-light: #ffffff;
            --text-dark: #1e293b;
            /* Ombre blanche douce demandée */
            --white-shadow: 0 4px 20px rgba(255, 255, 255, 0.25); 
        }

        body {
            background-color: #f8f9fa;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* --- HEADER & NAVIGATION --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999;
            background: linear-gradient(to bottom, rgba(10, 25, 47, 0.8), transparent);
        }

        /* Logo propre sans arrière-plan ni ombre noire */
        .brand-logo img {
            height: 70px; 
            width: auto;
            object-fit: contain;
            display: block;
        }

        /* --- BURGER MENU (3 traits) --- */
        .menu-trigger {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 1001;
            padding: 10px;
        }

        .menu-trigger span {
            display: block;
            width: 35px;
            height: 3px;
            background-color: var(--text-light);
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        #menu-checkbox {
            display: none;
        }

        /* --- SIDEBAR MENU --- */
        .sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100vh;
            background-color: rgba(10, 25, 47, 0.98);
            backdrop-filter: blur(15px);
            z-index: 1000;
            transition: right 0.4s cubic-bezier(0.77, 0.2, 0.05, 1);
            padding: 120px 40px 40px 40px;
            display: flex;
            flex-direction: column;
        }

        /* Déclenchement de l'affichage */
        #menu-checkbox:checked ~ .sidebar {
            right: 0;
        }

        /* Transformation des traits en X */
        #menu-checkbox:checked ~ .menu-trigger span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }
        #menu-checkbox:checked ~ .menu-trigger span:nth-child(2) {
            opacity: 0;
        }
        #menu-checkbox:checked ~ .menu-trigger span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        /* Liste des liens ordonnée */
        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-list li a {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.85);
            font-size: 1.25rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: block;
            padding: 12px 20px;
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
        }

        .nav-list li a:hover {
            color: var(--text-light);
            background-color: rgba(230, 0, 0, 0.1);
            border-left-color: var(--primary-color);
            padding-left: 30px;
        }

        /* --- HERO SECTION --- */
        .hero {
            height: 100vh;
            min-height: 600px;
            /* Utilisation de l'image de fond globale */
            background: linear-gradient(rgba(10, 25, 47, 0.7), rgba(10, 25, 47, 0.8)), url('image1hero.png') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            text-align: center;
        }

        .hero-content {
            max-width: 850px;
            color: var(--text-light);
        }

        .hero-content h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 20px;
            text-transform: uppercase;
            /* Ombre portée blanche subtile sur le titre */
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .hero-content p {
            font-size: 1.4rem;
            color: #cbd5e1;
            margin-bottom: 35px;
            font-weight: 300;
        }

        .btn-cta {
            display: inline-block;
            background-color: var(--primary-color);
            color: var(--text-light);
            padding: 15px 35px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            /* Application de l'ombre blanche sur le bouton au lieu du noir */
            box-shadow: var(--white-shadow);
        }

        .btn-cta:hover {
            background-color: #b30000;
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 255, 255, 0.4);
        }

        /* Responsive Mobile */
        @media (max-width: 500px) {
            .sidebar {
                width: 100%;
                right: -100%;
            }
            .hero-content h1 {
                font-size: 2.5rem;
            }
            .brand-logo img {
                height: 50px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <img src="logo.png" alt="NOXIS Logo">
        </div>

        <input type="checkbox" id="menu-checkbox">
        <label for="menu-checkbox" class="menu-trigger">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <nav class="sidebar">
            <ul class="nav-list">
                <li><a href="#accueil">Accueil</a></li>
                <li><a href="#qui-sommes-nous">Qui Sommes-Nous ?</a></li>
                <li><a href="#vision">Vision</a></li>
                <li><a href="#valeurs">Nos Valeurs</a></li>
                <li><a href="#services">Produits et Services</a></li>
                <li><a href="#partenaires">Nos Partenaires</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="accueil" class="hero">
        <div class="hero-content">
            <h1>Le Progrès</h1>
            <p>Une force motrice qui motive notre vision de l'avenir.</p>
            <a href="#qui-sommes-nous" class="btn-cta">Explorer</a>
        </div>
    </section>

</body>
</html>
