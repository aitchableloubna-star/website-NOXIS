<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOXIS | Solutions IT & Cloud</title>
    <style>
        /* --- RESET & VARIABLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        :root {
            --primary-color: #E60000; 
            --dark-bg: #0a192f;       
            --text-light: #ffffff;
            --text-dark: #1e293b;
        }

        body {
            background-color: #f8f9fa;
            color: var(--text-dark);
            overflow-x: hidden;
            /* On cache le curseur par défaut sur le Hero pour mettre en valeur le cercle */
            margin: 0;
        }

        /* --- EFFET SOURIS CERCLE LUMINEUX --- */
        .cursor-glow {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0) 70%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: fixed;
            transform: translate(-50%, -50%);
            pointer-events: none; /* Ne bloque pas les clics */
            z-index: 1;
            transition: width 0.2s ease, height 0.2s ease;
            mix-blend-mode: screen;
        }

        /* --- HEADER & NAVIGATION --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 25px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999;
            background: transparent; /* Suppression complète de tout fond ou ombre noire */
        }

        .brand-logo {
            display: flex;
            align-items: center;
        }

        /* LOGO PARFAITEMENT INTEGRÉ ET LISIBLE */
        .brand-logo img {
            height: 85px;
            width: auto;
            object-fit: contain;
            display: block;
            
            /* Rend le texte noir blanc et supprime le fond blanc pour fusionner avec le Hero */
            filter: invert(1) brightness(1.5);
            mix-blend-mode: lighten;
        }

        /* --- BURGER MENU (3 traits) --- */
        .menu-trigger {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 1001;
            padding: 10px;
        }

        .menu-trigger span {
            display: block;
            width: 35px;
            height: 3px;
            background-color: var(--text-light);
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        #menu-checkbox {
            display: none;
        }

        /* --- SIDEBAR MENU --- */
        .sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100vh;
            background-color: rgba(10, 25, 47, 0.98);
            backdrop-filter: blur(15px);
            z-index: 1000;
            transition: right 0.4s cubic-bezier(0.77, 0.2, 0.05, 1);
            padding: 140px 40px 40px 40px;
            display: flex;
            flex-direction: column;
        }

        #menu-checkbox:checked ~ .sidebar {
            right: 0;
        }

        #menu-checkbox:checked ~ .menu-trigger span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }
        #menu-checkbox:checked ~ .menu-trigger span:nth-child(2) {
            opacity: 0;
        }
        #menu-checkbox:checked ~ .menu-trigger span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-list li a {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.85);
            font-size: 1.25rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: block;
            padding: 12px 20px;
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
        }

        .nav-list li a:hover {
            color: var(--text-light);
            background-color: rgba(230, 0, 0, 0.1);
            border-left-color: var(--primary-color);
            padding-left: 30px;
        }

        /* --- HERO SECTION --- */
        .hero {
            height: 100vh;
            min-height: 600px;
            /* Background propre sans superposition de dégradé noir lourd */
            background: linear-gradient(rgba(10, 25, 47, 0.4), rgba(10, 25, 47, 0.5)), url('image1hero.png') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .hero-content {
            max-width: 850px;
            color: var(--text-light);
            position: relative;
            z-index: 3;
        }

        /* TEXTE AVEC ECLAT BLANC PUR */
        .hero-content h1 {
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
        }

        .hero-content p {
            font-size: 1.4rem;
            color: #e2e8f0;
            margin-bottom: 35px;
            font-weight: 300;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* BOUTON MODERNE AVEC SHADOW BLANCHE */
        .btn-cta {
            display: inline-block;
            background-color: var(--primary-color);
            color: var(--text-light);
            padding: 16px 40px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .btn-cta:hover {
            background-color: #b30000;
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.7);
        }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                right: -100%;
            }
            .hero-content h1 {
                font-size: 3rem;
            }
            .brand-logo img {
                height: 65px;
            }
            header {
                padding: 20px;
            }
            .cursor-glow {
                display: none; /* Désactivé sur mobile */
            }
        }
    </style>
</head>
<body>

    <div class="cursor-glow" id="mouse-glow"></div>

    <header>
        <div class="brand-logo">
            <img src="logo.png" alt="NOXIS Logo">
        </div>

        <input type="checkbox" id="menu-checkbox">
        <label for="menu-checkbox" class="menu-trigger">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <nav class="sidebar">
            <ul class="nav-list">
                <li><a href="#accueil">Accueil</a></li>
                <li><a href="#qui-sommes-nous">Qui Sommes-Nous ?</a></li>
                <li><a href="#vision">Vision</a></li>
                <li><a href="#valeurs">Nos Valeurs</a></li>
                <li><a href="#services">Produits et Services</a></li>
                <li><a href="#partenaires">Nos Partenaires</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="accueil" class="hero">
        <div class="hero-content">
            <h1>Le Progrès</h1>
            <p>Une force motrice qui motive notre vision de l'avenir.</p>
            <a href="#qui-sommes-nous" class="btn-cta">Explorer</a>
        </div>
    </section>

    <script>
        const glow = document.getElementById('mouse-glow');
        window.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        // Animation quand on passe sur le bouton (le cercle s'agrandit)
        const ctaButton = document.querySelector('.btn-cta');
        ctaButton.addEventListener('mouseenter', () => {
            glow.style.width = '350px';
            glow.style.height = '350px';
            glow.style.background = 'radial-gradient(circle, rgba(230, 0, 0, 0.2) 0%, rgba(230, 0, 0, 0) 70%)';
        });
        ctaButton.addEventListener('mouseleave', () => {
            glow.style.width = '300px';
            glow.style.height = '300px';
            glow.style.background = 'radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0) 70%)';
        });
    </script>

</body>
</html>
